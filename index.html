<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Bihar Construction Activity 2021–2026</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { margin:0; font-family: Arial, sans-serif; }
  header { background:#1f2a44; color:#fff; padding:10px 16px; }
  #wrap { display:flex; height: calc(100vh - 56px); }
  #map { flex:2; }
  #side { flex:1; padding:12px; overflow:auto; min-width:320px; background:#f7f7f7; }
  select { padding:4px; margin-right:8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  td, th { padding:4px; border-bottom:1px solid #ddd; text-align:left; }
  h3 { margin:14px 0 4px; }
  #card { background:#fff; border:1px solid #ddd; padding:10px; border-radius:6px; font-size:14px; }
  .legend { background:#fff; padding:8px; font-size:12px; line-height:18px; border-radius:4px; }
  .legend i { display:inline-block; width:14px; height:14px; margin-right:6px; vertical-align:middle; }
</style>
</head>
<body>
<header>
  <b>Bihar New Construction Activity</b> &nbsp;
  District: <select id="districtSel"><option value="">All Bihar</option></select>
  Level: <select id="levelSel">
    <option value="districts">District</option>
    <option value="subdistricts">Sub-district</option>
    <option value="villages">Village</option>
  </select>
  Show: <select id="metricSel"></select>
</header>

<div id="wrap">
  <div id="map"></div>
  <div id="side">
    <h3>Selected area</h3>
    <div id="card">Click an area on the map.</div>
    <h3 id="tableTitle">Top 10</h3>
    <table id="topTable"></table>
  </div>
</div>

<script>
const COLORS = ['#ffffcc', '#a1dab4', '#41b6c4', '#2c7fb8', '#253494'];
const LABELS = { score: 'Construction Activity Score (CAS)', area: 'Total construction (ha)', growth: 'Growth velocity' };
const LEVEL_NAMES = { districts: 'districts', subdistricts: 'sub-districts', villages: 'villages' };

const map = L.map('map', { preferCanvas: true }).setView([25.6, 85.6], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { attribution: '© OpenStreetMap contributors' }).addTo(map);

let layer = null, outline = null, legend = null;
let selDistrict = '';            // normalised district name, '' = all Bihar
const cache = {};

const norm = s => (s ?? '').toString().trim().toLowerCase();
const fmt = v => (v ?? 0).toLocaleString(undefined, { maximumFractionDigits: 2 });

async function load(level) {
  if (!cache[level]) cache[level] = await (await fetch(`data/${level}.geojson`)).json();
  return cache[level];
}

function fillMetrics() {
  metricSel.innerHTML = '';
  metricSel.add(new Option(LABELS.score, 'score'));
  metricSel.add(new Option(LABELS.area, 'area'));
  if (levelSel.value === 'villages') metricSel.add(new Option(LABELS.growth, 'growth'));
}

async function fillDistricts() {
  const d = await load('districts');
  d.features.map(f => f.properties.name).sort()
    .forEach(n => districtSel.add(new Option(n, norm(n))));
}

function getBreaks(vals) {
  const s = [...vals].sort((a, b) => a - b);
  return [0.2, 0.4, 0.6, 0.8].map(q => s[Math.floor(q * (s.length - 1))]);
}
function getColor(v, b) {
  return v <= b[0] ? COLORS[0] : v <= b[1] ? COLORS[1] :
         v <= b[2] ? COLORS[2] : v <= b[3] ? COLORS[3] : COLORS[4];
}

function drawLegend(b) {
  if (legend) map.removeControl(legend);
  legend = L.control({ position: 'bottomleft' });
  legend.onAdd = () => {
    const d = L.DomUtil.create('div', 'legend');
    const edges = [`≤ ${fmt(b[0])}`, `${fmt(b[0])} – ${fmt(b[1])}`, `${fmt(b[1])} – ${fmt(b[2])}`,
                   `${fmt(b[2])} – ${fmt(b[3])}`, `> ${fmt(b[3])}`];
    d.innerHTML = '<b>' + LABELS[metricSel.value] + '</b><br>' +
      COLORS.map((c, i) => `<i style="background:${c}"></i>${edges[i]}`).join('<br>');
    return d;
  };
  legend.addTo(map);
}

// is this feature inside the selected district?
function inSelected(level, p) {
  if (!selDistrict) return true;
  return level === 'districts' ? norm(p.name) === selDistrict : norm(p.district) === selDistrict;
}

async function draw() {
  const level = levelSel.value, metric = metricSel.value;
  const data = await load(level);

  // colour classes always use ALL of Bihar, so colours mean the same thing everywhere
  const breaks = getBreaks(data.features.map(f => f.properties[metric] ?? 0));

  // at sub-district / village level show only the selected district
  const shown = (level === 'districts' || !selDistrict)
    ? data.features
    : data.features.filter(f => inSelected(level, f.properties));

  if (layer) map.removeLayer(layer);
  if (outline) map.removeLayer(outline);

  layer = L.geoJSON({ type: 'FeatureCollection', features: shown }, {
    pointToLayer: (f, ll) => L.circleMarker(ll, { radius: selDistrict ? 4 : 3 }),
    style: f => {
      const isSel = selDistrict && level === 'districts' && inSelected(level, f.properties);
      const dimmed = selDistrict && level === 'districts' && !isSel;
      return {
        fillColor: getColor(f.properties[metric] ?? 0, breaks),
        color: level === 'villages' ? 'transparent' : (isSel ? '#000' : '#555'),
        weight: isSel ? 3 : 0.8,
        fillOpacity: dimmed ? 0.2 : 0.85
      };
    },
    onEachFeature: (f, l) => {
      const p = f.properties;
      const where = p.district && p.name !== p.district ? ` (${p.district})` : '';
      l.bindTooltip(p.name + where + ': ' + fmt(p[metric]));
      l.on('click', () => showCard(p));
    }
  }).addTo(map);

  // black outline of the selected district on top of sub-district / village views
  if (selDistrict && level !== 'districts') {
    const d = await load('districts');
    const f = d.features.find(x => norm(x.properties.name) === selDistrict);
    if (f) outline = L.geoJSON(f, {
      interactive: false,
      style: { color: '#000', weight: 3, fill: false }
    }).addTo(map);
  }

  drawLegend(breaks);
  showTable(shown, metric, level);
}

function showCard(p) {
  card.innerHTML = `<b>${p.name}</b>` +
    (p.district && p.name !== p.district ? `<br>District: ${p.district}` : '') +
    (p.sub_district ? `<br>Sub-district: ${p.sub_district}` : '') +
    `<br>Rank: <b>${p.rank ?? 'n/a'}</b>` +
    `<br>CAS: ${fmt(p.score)}` +
    `<br>Total construction: ${fmt(p.area)} ha` +
    (p.growth !== undefined ? `<br>Growth velocity: ${fmt(p.growth)}` : '');
}

function showTable(features, metric, level) {
  const where = selDistrict ? ' in ' + districtSel.options[districtSel.selectedIndex].text : ' in Bihar';
  tableTitle.textContent = 'Top 10 ' + LEVEL_NAMES[level] + where;
  const top = [...features]
    .sort((a, b) => (b.properties[metric] ?? 0) - (a.properties[metric] ?? 0))
    .slice(0, 10);
  if (!top.length) {
    topTable.innerHTML = '<tr><td>No data for this selection.</td></tr>';
    return;
  }
  topTable.innerHTML = '<tr><th>#</th><th>Name</th><th>Value</th></tr>' +
    top.map((f, i) => {
      const p = f.properties;
      const extra = p.district && p.name !== p.district
        ? `<br><small style="color:#666">${p.district}</small>` : '';
      return `<tr><td>${i + 1}</td><td>${p.name}${extra}</td><td>${fmt(p[metric])}</td></tr>`;
    }).join('');
}

async function zoomToDistrict() {
  if (!selDistrict) { map.setView([25.6, 85.6], 7); return; }
  const d = await load('districts');
  const f = d.features.find(x => norm(x.properties.name) === selDistrict);
  if (f) map.fitBounds(L.geoJSON(f).getBounds(), { padding: [30, 30] });
}

async function showDistrictCard() {
  if (!selDistrict) { card.innerHTML = 'Click an area on the map.'; return; }
  const d = await load('districts');
  const f = d.features.find(x => norm(x.properties.name) === selDistrict);
  if (f) showCard(f.properties);
}

districtSel.onchange = async () => {
  selDistrict = districtSel.value;
  await draw();
  await zoomToDistrict();
  await showDistrictCard();
};
levelSel.onchange = () => { fillMetrics(); draw(); };
metricSel.onchange = draw;

fillMetrics();
fillDistricts();
draw();
</script>
</body>
</html>
